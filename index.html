<!DOCTYPE html>
<html lang="ko">
<head>

<title>이소윤</title>

    box-sizing:border-box;
}
body{

    font-family:system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.container{
    width:90%;
    max-width:800px;
    padding:40px;
}
.card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:20px;
    padding:40px;
    backdrop-filter:blur(10px);
}
h1{
    font-size:3rem;
    margin-bottom:10px;
}
.subtitle{
    color:#b0b0b0;
    margin-bottom:30px;
}
.section{
    margin-top:25px;
}
.section h2{
    margin-bottom:10px;
    font-size:1.2rem;
}
.skills{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}
.skill{
    background:#202030;
    padding:8px 14px;
    border-radius:999px;
}
.contact{
    line-height:2;
    color:#d0d0d0;
}
