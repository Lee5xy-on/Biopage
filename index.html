<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Roblox Live Servers</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #0d0d0f;
            color: #ffffff;

            font-family:
                Arial,
                "Noto Sans KR",
                sans-serif;
        }

        .container {
            width: min(1100px, calc(100% - 32px));
            margin: 0 auto;
            padding: 50px 0;
        }

        h1 {
            margin: 0;
            font-size: 32px;
        }

        .subtitle {
            margin-top: 8px;
            color: #8c8c96;
        }

        .status {
            margin-top: 25px;
            color: #8c8c96;
            font-size: 14px;
        }

        .games {
            display: grid;
            grid-template-columns:
                repeat(auto-fill, minmax(280px, 1fr));

            gap: 16px;
            margin-top: 25px;
        }

        .game {
            display: flex;
            align-items: center;

            padding: 16px;

            background: #151518;
            border: 1px solid #242429;
            border-radius: 14px;

            transition:
                transform 0.15s ease,
                border-color 0.15s ease;
        }

        .game:hover {
            transform: translateY(-2px);
            border-color: #3a3a42;
        }

        .icon {
            width: 64px;
            height: 64px;

            border-radius: 12px;

            object-fit: cover;

            background: #222228;

            flex-shrink: 0;
        }

        .info {
            min-width: 0;
            margin-left: 14px;
        }

        .name {
            font-size: 17px;
            font-weight: 600;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .players {
            margin-top: 7px;

            color: #9d9da7;
            font-size: 14px;
        }

        .empty {
            padding: 50px 20px;

            text-align: center;

            color: #777780;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Roblox Live Servers</h1>

    <div class="subtitle">
        현재 실행 중인 게임 서버
    </div>

    <div id="status" class="status">
        서버 정보를 불러오는 중...
    </div>

    <div id="games" class="games"></div>

</div>

<script>

const API =
    "https://biopage-worker.jammin-is-cute.workers.dev";


const gamesElement =
    document.getElementById("games");

const statusElement =
    document.getElementById("status");


async function loadGames() {

    try {

        const response =
            await fetch(
                `${API}/api/games`,
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data =
            await response.json();

        renderGames(data.games || []);

        statusElement.textContent =
            `현재 ${data.count || 0}개의 게임 서버가 온라인입니다.`;

    } catch (error) {

        console.error(error);

        statusElement.textContent =
            "서버 정보를 가져오지 못했습니다.";

    }
}


function renderGames(games) {

    gamesElement.innerHTML = "";

    if (games.length === 0) {

        gamesElement.innerHTML = `
            <div class="empty">
                현재 실행 중인 게임 서버가 없습니다.
            </div>
        `;

        return;
    }


    for (const game of games) {

        const element =
            document.createElement("div");

        element.className = "game";


        const icon =
            document.createElement("img");

        icon.className = "icon";

        icon.src =
            game.icon ||
            "https://tr.rbxcdn.com/180DAY-0/150/150/Image/Webp/noFilter";


        const info =
            document.createElement("div");

        info.className = "info";


        const name =
            document.createElement("div");

        name.className = "name";

        name.textContent =
            game.name || "Unknown Game";


        const players =
            document.createElement("div");

        players.className = "players";

        players.textContent =
            `${Number(game.playing || 0).toLocaleString()}명 접속 중`;


        info.appendChild(name);
        info.appendChild(players);

        element.appendChild(icon);
        element.appendChild(info);

        gamesElement.appendChild(element);
    }
}


/*
 * 5초마다 목록 갱신.
 *
 * Worker의 활성 TTL은 12초이므로
 * 서버가 죽으면 최대 약 12초 안에 사라집니다.
 */

loadGames();

setInterval(
    loadGames,
    5000
);

</script>

</body>
</html>
