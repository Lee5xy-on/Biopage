<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roblox Game Dashboard</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0d0d0f;
    color:#fff;
    font-family:Arial,sans-serif;
    min-height:100vh;
}

.container{
    width:min(1200px,calc(100% - 32px));
    margin:40px auto;
}

h1{
    font-size:32px;
    margin-bottom:10px;
}

.subtitle{
    color:#8a8a96;
    margin-bottom:25px;
}

.status{
    color:#8a8a96;
    margin-bottom:25px;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:16px;
}

.game{
    display:flex;
    align-items:center;

    padding:16px;

    background:#151518;
    border:1px solid #242429;

    border-radius:14px;

    text-decoration:none;
    color:inherit;

    transition:0.15s ease;
}

.game:hover{
    transform:translateY(-2px);
    border-color:#3f82ff;
}

.icon{
    width:72px;
    height:72px;

    border-radius:12px;

    object-fit:cover;

    background:#202024;

    flex-shrink:0;
}

.info{
    margin-left:14px;
    min-width:0;
    flex:1;
}

.name{
    font-size:18px;
    font-weight:600;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.players{
    margin-top:6px;
    color:#9d9da7;
    font-size:14px;
}

.status-badge{
    display:inline-block;

    margin-top:8px;

    padding:4px 10px;

    border-radius:999px;

    font-size:12px;
    font-weight:700;
}

.status-badge.online{
    background:rgba(0,255,120,.15);
    color:rgb(0,255,120);
}

.status-badge.offline{
    background:rgba(255,80,80,.15);
    color:rgb(255,80,80);
}

.empty{
    padding:40px;
    text-align:center;
    color:#8a8a96;
}

</style>
</head>

<body>

<div class="container">

    <h1>Roblox Dashboard</h1>

    <div class="subtitle">
        실시간 게임 상태
    </div>

    <div id="status" class="status">
        불러오는 중...
    </div>

    <div id="games" class="games"></div>

</div>

<script>

const API = "https://biopage-worker.jammin-is-cute.workers.dev";

const gamesElement =
    document.getElementById("games");

const statusElement =
    document.getElementById("status");

function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
}

async function loadGames(){

    try{

        const response =
            await fetch(
                `${API}/api/games`,
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){
            throw new Error(
                `HTTP ${response.status}`
            );
        }

        const data =
            await response.json();

        renderGames(
            data.games || []
        );

        statusElement.textContent =
            `총 ${data.count || 0}개 게임`;

    }catch(error){

        console.error(error);

        statusElement.textContent =
            "서버 연결 실패";
    }
}

function renderGames(games){

    gamesElement.innerHTML = "";

    if(games.length === 0){

        gamesElement.innerHTML = `
            <div class="empty">
                게임이 없습니다.
            </div>
        `;

        return;
    }

    const now = Date.now();

    for(const game of games){

        const online =
            typeof game.online === "boolean"
                ? game.online
                : (
                    game.expiresAt &&
                    now < Number(game.expiresAt)
                );

        const card =
            document.createElement("a");

        card.className =
            "game";

        card.href =
            `https://www.roblox.com/games/${game.placeId}`;

        card.target =
            "_blank";

        card.rel =
            "noopener noreferrer";

        card.innerHTML = `

            <img
                class="icon"
                src="${game.icon || ""}"
                alt=""
            >

            <div class="info">

                <div class="name">
                    ${escapeHtml(game.name)}
                </div>

                <div class="players">
                    ${
                        online
                            ? `${Number(game.playing || 0).toLocaleString()}명 접속 중`
                            : "현재 오프라인"
                    }
                </div>

                <div class="status-badge ${
                    online
                        ? "online"
                        : "offline"
                }">
                    ${
                        online
                            ? "ONLINE"
                            : "OFFLINE"
                    }
                </div>

            </div>
        `;

        gamesElement.appendChild(card);
    }
}

loadGames();

setInterval(
    loadGames,
    5000
);

</script>

</body>
</html>
