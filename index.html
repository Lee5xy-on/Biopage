<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Information</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
}

body {
    background: #050505;
    color: #fff;
    height: 100vh;
    overflow: hidden;
}

.background {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 20% 20%, #111 0%, transparent 40%),
                radial-gradient(circle at 80% 60%, #0a0a0a 0%, transparent 45%),
                #050505;
}

.topbar {
    position: absolute;
    top: 0;
    width: 100%;
    padding: 18px 40px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    opacity: 0.7;
}

.center {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}

.title {
    font-size: 72px;
    font-weight: 700;
    letter-spacing: -2px;
    background: linear-gradient(90deg, #fff, #888);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    margin-top: 10px;
    font-size: 14px;
    opacity: 0.6;
}

.cards {
    position: absolute;
    top: 62%;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
}

.card {
    width: 320px;
    height: 220px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 20px;
    backdrop-filter: blur(12px);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-6px);
    border-color: rgba(255,255,255,0.2);
}

.card h2 {
    font-size: 14px;
    margin-bottom: 10px;
    opacity: 0.7;
    letter-spacing: 1px;
}

.card .big {
    font-size: 26px;
    font-weight: 700;
    margin-bottom: 10px;
}

.card p {
    font-size: 13px;
    opacity: 0.6;
    line-height: 1.5;
}

</style>
</head>

<body>
<div class="background"></div>

<div class="topbar">
    <div>INFORMATION</div>
</div>

<div class="center">
    <div class="title">Information</div>
    <div class="subtitle">개발 경력 5년 · 완성재단 개발자</div>
</div>

<div class="cards">

    <div class="card">
        <h2>PROFILE</h2>
        <div class="big">이소윤</div>
        <p>
            로블록스 스튜디오 개발자<br>
            구조 설계와 시스템 제작을 담당합니다.
        </p>
    </div>

    <div class="card">
        <h2>SOCIAL</h2>
        <p>
            Discord: 7f._1xew.er<br>
            Xchat: 0x1ffw<br>
            Roblox: 1xV0e<br>
            GitHub: Lee5xy-on
        </p>
    </div>

    <div class="card">
        <h2>CONTACT</h2>
        <p>
            contactme@7fnxewer.xyz
        </p>
    </div>

</div>

</body>
</html>
